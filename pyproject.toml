[project]
name = "astro-research"
version = "0.1.0"
description = "Headless astronomical calculation engine for exploratory astrology research"
requires-python = ">=3.13"
dependencies = [
    "pysweph==2.10.3.6",
    "tzdata==2026.6",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.uv]
# pyswisseph installs the same `swisseph` module as pysweph and silently overwrites it
# (`pip check` still passes). An unsatisfiable constraint makes any attempt to pull it in
# fail resolution instead.
constraint-dependencies = ["pyswisseph<0"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["astro_research"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# pysweph ships no type information; the adapter converts its results to typed values.
module = ["swisseph"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
