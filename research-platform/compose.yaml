# PostgreSQL for the research platform's tests and local development, on 127.0.0.1:55432.
#   docker compose -f research-platform/compose.yaml up -d
# The credentials are local-only test values; nothing outside this machine can connect.
services:
  postgres:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_DB: research
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research-local-only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - research-postgres:/var/lib/postgresql

volumes:
  research-postgres:
