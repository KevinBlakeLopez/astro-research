[project]
name = "research-platform"
version = "0.1.0"
description = "Research platform on the astro-research engine: subjects, sources, birth records, datasets and calculation runs"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
dependencies = [
    "astro-research",
    "django==6.1.3",
    "django-stubs-ext==6.1.2",
    "psycopg[binary]==3.3.8",
    "truststore==0.10.5",
    "waitress==3.0.2",
]

[project.optional-dependencies]
desktop = [
    "pywebview==6.2.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
astro-research = { workspace = true }

[dependency-groups]
dev = [
    "django-stubs==6.1.2",
    "pytest-django==4.14.0",
    "types-waitress==3.0.1.20260724",
]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
# pywebview is the desktop extra's, so it's missing unless that extra is installed.
module = ["swisseph", "webview"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "research_platform.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "research_platform.settings"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
