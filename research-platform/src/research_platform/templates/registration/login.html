{% extends "research_platform/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<h1>Log in</h1>
{% if form.errors %}<p class="refusal">That username and password don't match an account.</p>{% endif %}
<form method="post" action="{% url 'login' %}">
  {% csrf_token %}
  <p><label>Username <input name="username" autocomplete="username" required autofocus></label></p>
  <p><label>Password <input name="password" type="password" autocomplete="current-password" required></label></p>
  <input type="hidden" name="next" value="{{ next }}">
  <p><button type="submit">Log in</button></p>
</form>
{% endblock %}
